[project]
name = "crewpilot-backend"
version = "0.0.1"
description = "CrewPilot backend — FastAPI + CrewAI."
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "product-crew",
]

[project.scripts]
dev = "app.cli:dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
product-crew = { path = "product_crew", editable = false }

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.uv]
# CrewAI pulls in chromadb → onnxruntime. onnxruntime 1.26.0 ships no macOS
# arm64 wheels, breaking local dev on Apple Silicon. We don't use CrewAI's
# memory features, so pin to a version range that has macOS arm64 wheels.
override-dependencies = [
    "onnxruntime>=1.20.0,<1.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
